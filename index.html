      darkMode: 'class',

        extend: {
          animation: {

          keyframes: {
            slideInLeft: {
              '0%': { transform: 'translateX(100%)', opacity: '0' },
              '100%': { transform: 'translateX(0)', opacity: '1' },

            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            zoomIn: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            soundBar: {
              '0%, 100%': { height: '0.5rem' },
              '50%': { height: '1.25rem' },
            },
          },
        },
      },
    }
