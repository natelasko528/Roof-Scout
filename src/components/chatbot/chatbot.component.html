<!-- Chatbot Sidebar -->
<aside class="w-96 h-full flex flex-col bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 shadow-2xl animate-slide-in-left">
  
  <!-- Header -->
  <header class="flex-shrink-0 flex justify-between items-center p-4 border-b border-slate-200 dark:border-slate-700">
    <h2 class="text-xl font-bold text-sky-600 dark:text-sky-400 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>
      AI Scout
    </h2>
    <button (click)="closeChat.emit()" class="p-1 rounded-full text-slate-500 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 text-2xl leading-none">&times;</button>
  </header>

  <!-- Message Area -->
  <div #messagesContainer class="flex-grow p-4 space-y-4 overflow-y-auto bg-slate-50 dark:bg-slate-900">
    @for (message of messages(); track $index) {
      <div class="flex" [class.justify-end]="message.role === 'user'" [class.justify-start]="message.role === 'model'">
        <div 
          class="max-w-md p-3 rounded-2xl shadow-sm"
          [class.bg-sky-500]="message.role === 'user'"
          [class.text-white]="message.role === 'user'"
          [class.rounded-br-lg]="message.role === 'user'"
          [class.bg-white]="message.role === 'model'"
          [class.dark:bg-slate-700]="message.role === 'model'"
          [class.rounded-bl-lg]="message.role === 'model'">
          <div class="prose prose-sm prose-slate dark:prose-invert max-w-none" [innerHTML]="message.html"></div>
        </div>
      </div>
    }
    @if (isLoading() && !isSpeaking()) {
      <div class="flex justify-start">
        <div class="max-w-md p-3 rounded-2xl rounded-bl-lg bg-white dark:bg-slate-700">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-sky-500 rounded-full animate-pulse"></div>
            <div class="w-2 h-2 bg-sky-500 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
            <div class="w-2 h-2 bg-sky-500 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
          </div>
        </div>
      </div>
    }
    @if (isSpeaking()) {
        <div class="flex justify-start">
            <div class="max-w-md p-3 rounded-2xl rounded-bl-lg bg-white dark:bg-slate-700">
                <div class="flex items-center justify-center gap-1 h-5">
                    <div class="w-1 bg-sky-500 rounded-full animate-sound-bar" style="animation-delay: 0s;"></div>
                    <div class="w-1 bg-sky-500 rounded-full animate-sound-bar" style="animation-delay: 0.2s;"></div>
                    <div class="w-1 bg-sky-500 rounded-full animate-sound-bar" style="animation-delay: 0.4s;"></div>
                    <div class="w-1 bg-sky-500 rounded-full animate-sound-bar" style="animation-delay: 0.6s;"></div>
                </div>
            </div>
        </div>
    }
  </div>

  <!-- Input Form -->
  <footer class="flex-shrink-0 p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
    <form (ngSubmit)="sendMessage()" class="flex gap-2">
      <input 
        type="text"
        [(ngModel)]="userInput"
        name="userInput"
        placeholder="Ask AI Scout..."
        class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-full px-4 py-2 text-slate-900 dark:text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none transition-shadow"
        [disabled]="isLoading()">
      
      <div class="flex items-center">
        @if (isMicrophoneAvailable()) {
          <button
            type="button"
            (click)="startManualListen()"
            class="text-slate-500 dark:text-slate-400 rounded-full p-2.5 transition-colors hover:bg-slate-200 dark:hover:bg-slate-700"
            [class.text-sky-500]="isListening()"
            [disabled]="isLoading() || isLiveConversation()">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>
          </button>
          
          <button
            type="button"
            (click)="toggleLiveConversation()"
            class="rounded-full p-2.5 transition-all text-white"
            [class.bg-red-600]="isLiveConversation()"
            [class.hover:bg-red-700]="isLiveConversation()"
            [class.bg-indigo-600]="!isLiveConversation()"
            [class.hover:bg-indigo-700]="!isLiveConversation()"
            title="Toggle Live Conversation">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M11.25 4.507v15.018a.75.75 0 0 0 1.5 0V4.507a.75.75 0 0 0-1.5 0Z" /><path d="M6 8.268v7.5a.75.75 0 0 0 1.5 0v-7.5a.75.75 0 0 0-1.5 0Z" /><path d="M16.5 6.75v10.5a.75.75 0 0 0 1.5 0V6.75a.75.75 0 0 0-1.5 0Z" /></svg>
          </button>
        }
      </div>

      <button 
        type="submit" 
        class="bg-sky-600 text-white rounded-full p-2.5 shadow-md hover:bg-sky-700 disabled:bg-slate-500 transition-all"
        [disabled]="isLoading() || !userInput()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" />
        </svg>
      </button>
    </form>
  </footer>
</aside>
<style>
  @keyframes sound-bar {
    0%, 100% { height: 0.5rem; }
    50% { height: 1.25rem; }
  }
  .animate-sound-bar {
    animation: sound-bar 1.2s infinite ease-in-out;
  }
</style>
