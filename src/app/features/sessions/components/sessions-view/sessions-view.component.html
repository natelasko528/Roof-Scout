<div class="p-4 animate-fade-in">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Sessions</h1>
    <div class="flex gap-2 items-center">
      <button (click)="generatePerformancePDF()" class="px-3 py-2 bg-rose-600 text-white rounded-md hover:bg-rose-700 transition-colors text-sm font-semibold flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z" /></svg>
        Performance Report
      </button>
      <button (click)="exportData()" class="px-3 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 transition-colors text-sm font-semibold flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        Export Leads
      </button>
      <button (click)="createNewSession()" class="px-3 py-2 bg-sky-600 text-white rounded-md hover:bg-sky-700 transition-colors text-sm font-semibold flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
        New Session
      </button>
    </div>
  </div>

  <div class="space-y-3">
    @for (session of allSessions(); track session.id) {
      <div 
        (click)="loadSession(session)" 
        class="bg-white dark:bg-slate-800 rounded-lg p-4 shadow-md cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-200 border border-slate-200 dark:border-transparent"
        [class.border-2]="activeSessionId() === session.id"
        [class.border-sky-500]="activeSessionId() === session.id">
        <div class="flex justify-between items-center">
          <div class="flex-1">
            <p class="font-bold text-slate-900 dark:text-slate-100">{{ session.name }}</p>
            <p class="text-sm text-slate-500 dark:text-slate-400">
              {{ session.createdAt | date:'medium' }} &bull; {{ session.leads.length }} leads
            </p>
          </div>
          <div class="flex gap-2">
            <button (click)="generateSessionPDF($event, session)" class="p-2 rounded-md text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/20 transition-colors" title="Download Session Report">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" /></svg>
            </button>
            <button (click)="deleteSession($event, session)" class="p-2 rounded-full text-slate-400 dark:text-slate-400 hover:bg-red-500 hover:text-white transition-colors" title="Delete Session">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
