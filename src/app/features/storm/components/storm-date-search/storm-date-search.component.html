<div class="relative" data-testid="storm-date-search">
  <div class="flex items-center gap-2">
    <label class="flex items-center gap-2 text-sm font-medium text-slate-700 dark:text-slate-300">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-500 dark:text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
      Storm Date:
    </label>
    <input
      type="date"
      data-testid="storm-date-input"
      [value]="selectedDate()"
      [min]="getMinDate()"
      [max]="getTodayDate()"
      [disabled]="disabled()"
      [placeholder]="placeholder()"
      (change)="onDateChange($event)"
      class="px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed text-sm" />
    
    @if (selectedDate()) {
      <button
        data-testid="clear-date-btn"
        (click)="clearDate()"
        [disabled]="disabled()"
        class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        title="Clear date">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    }
  </div>
</div>
