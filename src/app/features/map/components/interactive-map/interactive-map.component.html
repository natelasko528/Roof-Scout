<div class="w-full h-full relative">
  <div #mapContainer class="w-full h-full bg-gray-200"></div>

  <!-- Search Bar -->
  <div class="absolute top-3 left-1/2 -translate-x-1/2 z-[1000] w-full max-w-sm px-4">
    <div class="relative bg-white dark:bg-slate-800 rounded-lg shadow-lg">
      <input
        type="text"
        placeholder="Search for an address..."
        class="w-full bg-transparent border border-slate-300 dark:border-slate-700 rounded-lg px-4 py-2 text-slate-900 dark:text-slate-200 focus:ring-2 focus:ring-sky-500 focus:outline-none"
        (input)="onSearchInput($event)"
        (focus)="isSearchFocused.set(true)"
        (blur)="hideSearchResultsWithDelay()">

      @if (isSearching()) {
        <div class="absolute right-3 top-1/2 -translate-y-1/2">
          <svg class="animate-spin h-5 w-5 text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </div>
      }

      @if (isSearchFocused() && searchResults().length > 0) {
        <ul class="absolute top-full mt-2 w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg shadow-lg overflow-hidden animate-fade-in-fast max-h-60 overflow-y-auto">
          @for (result of searchResults(); track result.place_id) {
            <li
              (mousedown)="selectSearchResult(result)"
              class="px-4 py-2 cursor-pointer hover:bg-sky-100 dark:hover:bg-sky-900 text-slate-700 dark:text-slate-300">
              {{ result.display_name }}
            </li>
          }
        </ul>
      }
    </div>
  </div>

  <!-- GIS Controls -->
  <div class="absolute top-3 right-4 z-[1000] flex flex-col gap-2">
    <!-- Heatmap Toggle -->
    <button
      (click)="toggleHeatmapView()"
      [class]="showHeatmap() ? 'bg-orange-500 hover:bg-orange-600' : 'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'"
      class="px-3 py-2 rounded-lg shadow-lg text-xs font-medium transition-colors flex items-center gap-2 border border-slate-300 dark:border-slate-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [class]="showHeatmap() ? 'text-white' : 'text-slate-700 dark:text-slate-200'" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        <path d="M11 6h2v7h-2zM8 9h2v4H8zM14 8h2v5h-2z" fill="white"/>
      </svg>
      <span [class]="showHeatmap() ? 'text-white' : 'text-slate-700 dark:text-slate-200'">Heatmap</span>
    </button>

    <!-- Weather Overlay Toggle -->
    <button
      (click)="toggleWeatherOverlayView()"
      [class]="showWeatherOverlay() ? 'bg-blue-500 hover:bg-blue-600' : 'bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700'"
      class="px-3 py-2 rounded-lg shadow-lg text-xs font-medium transition-colors flex items-center gap-2 border border-slate-300 dark:border-slate-600">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [class]="showWeatherOverlay() ? 'text-white' : 'text-slate-700 dark:text-slate-200'" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
      </svg>
      <span [class]="showWeatherOverlay() ? 'text-white' : 'text-slate-700 dark:text-slate-200'">Weather</span>
    </button>

    <!-- Territory Drawing Info -->
    <div class="bg-white dark:bg-slate-800 rounded-lg shadow-lg px-3 py-2 border border-slate-300 dark:border-slate-600">
      <div class="text-xs font-medium text-slate-700 dark:text-slate-200 mb-1">Territories</div>
      <div class="text-xs text-slate-500 dark:text-slate-400">Use map controls to draw territories</div>
    </div>
  </div>
</div>
